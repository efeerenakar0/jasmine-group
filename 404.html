<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Sayfa Bulunamadı | Jasmine Group®</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: url('https://images.unsplash.com/photo-1589839498263-1498ec5b51d8?auto=format&fit=crop&w=1920&q=80') center center / cover no-repeat;
      position: relative;
    }
    
    /* Overlay to make text readable */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to right, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.4) 50%, rgba(0,0,0,0) 100%);
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      padding: 0 10%;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .error-code {
      font-size: 140px;
      font-weight: 900;
      color: #1e293b;
      margin: 0;
      line-height: 1;
      letter-spacing: -3px;
    }

    .error-msg {
      font-size: 20px;
      color: #334155;
      font-weight: 500;
      margin-top: 10px;
      margin-bottom: 40px;
    }

    .quick-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .quick-links li {
      margin-bottom: 12px;
    }

    .quick-links a {
      text-decoration: none;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      transition: 0.2s;
    }
    
    .quick-links a:hover {
      color: #e11d48;
      transform: translateX(5px);
    }

    .quick-links a i {
      color: #f59e0b;
      margin-right: 10px;
      font-size: 13px;
    }

    /* Floating Search Bar */
    .floating-search-bar {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 15px;
      border-radius: 12px;
      z-index: 2;
      width: 90%;
      max-width: 900px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .search-input-row {
      position: relative;
      margin-bottom: 15px;
    }
    
    .search-input-row input {
      width: 100%;
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-family: inherit;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }

    .search-input-row i {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #e11d48;
      font-size: 20px;
      font-weight: 900;
    }

    .search-filters-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 15px;
    }

    .filter-select {
      background: #fff;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .btn-advanced {
      background: #e11d48;
      color: #fff;
      border: none;
      padding: 0 30px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-advanced:hover {
      background: #be123c;
    }

    @media (max-width: 768px) {
      .error-code { font-size: 90px; }
      .search-filters-row { grid-template-columns: 1fr; }
      .btn-advanced { padding: 15px; }
      .floating-search-bar { bottom: 20px; padding: 10px; }
      .content-wrapper { padding: 0 5%; transform: translateY(-80px); }
    }
  </style>
  <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
</head>
<body>

  <div class="overlay"></div>

  <div class="content-wrapper">
    <h1 class="error-code">404</h1>
    <p class="error-msg">The page you requested could not be found!</p>
    
    <ul class="quick-links">
      <li><a href="index.html"><i class="fa-solid fa-angle-right"></i> Go to Home Page</a></li>
      <li><a href="buy.html"><i class="fa-solid fa-angle-right"></i> All Real Estate in Turkey</a></li>
      <li><a href="buy.html"><i class="fa-solid fa-angle-right"></i> All Apartments for Sale in Turkey</a></li>
      <li><a href="buy.html"><i class="fa-solid fa-angle-right"></i> All Houses for Sale in Turkey</a></li>
      <li><a href="buy.html"><i class="fa-solid fa-angle-right"></i> All Commercial Real Estate in Turkey</a></li>
      <li><a href="buy.html"><i class="fa-solid fa-angle-right"></i> All Land for Sale in Turkey</a></li>
    </ul>
  </div>

  <div class="floating-search-bar">
    <form action="buy.html" method="GET">
      <div class="search-input-row">
        <input type="text" placeholder="e.g. Home for sale in Antalya Lara" />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <div class="search-filters-row">
        <div class="filter-select">
          <span>WHERE?</span> <i class="fa-solid fa-chevron-down" style="color:#94a3b8; font-size:12px;"></i>
        </div>
        <div class="filter-select">
          <span>TYPE</span> <i class="fa-solid fa-chevron-down" style="color:#94a3b8; font-size:12px;"></i>
        </div>
        <div class="filter-select">
          <span>ROOMS</span> <i class="fa-solid fa-chevron-down" style="color:#94a3b8; font-size:12px;"></i>
        </div>
        <button type="submit" class="btn-advanced">ADVANCED SEARCH</button>
      </div>
    </form>
  </div>

</body>
</html>
